name: Deploy to GitHub Pages

on:
  # Deploy on every push to the main branch.
  push:
    branches: [main]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt
# a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        # The site is published to the custom domain (see public/CNAME),
        # which is served from the root, so asset paths must be root
        # relative and no base path is applied.
        #
        # Do NOT set NEXT_PUBLIC_BASE_PATH from
        # steps.pages.outputs.base_path: configure-pages reports "/<repo>"
        # while GitHub still associates the repository with its project
        # site, which bakes "/<repo>/_next/..." into the HTML and 404s
        # every asset at the custom domain (the page loads with no CSS).
        run: npm run build

      - name: Verify the export
        # Fails the build on broken links or unpaired bilingual text
        # rather than letting problems reach production.
        run: npm run verify

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
